name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version sync
        run: |
          python - <<'EOF'
          import re, sys, tomllib
          from pathlib import Path
          init = Path("blacklight/__init__.py").read_text()
          m = re.search(r'__version__\s*=\s*"([^"]+)"', init)
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8-sig"))
          if not m or m.group(1) != pyproject["project"]["version"]:
              print(
                  f"version mismatch: __init__={m.group(1) if m else '(not found)'} "
                  f"pyproject={pyproject['project']['version']}"
              )
              sys.exit(1)
          EOF

      - name: Check release tag matches version
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          from pathlib import Path
          ref = os.environ.get("GITHUB_REF_NAME", "")
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8-sig"))["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print(f"version {version!r} is not a plain X.Y.Z release")
              sys.exit(1)
          if ref != "v" + version:
              print(f"tag {ref!r} does not match v{version}")
              sys.exit(1)
          EOF

      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest --tb=short

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/blacklight version
          /tmp/smoke/bin/python -c "import blacklight, blacklight.web, blacklight.tui, blacklight.scoring; print('imports ok')"
          /tmp/smoke/bin/python -c "from pathlib import Path; import blacklight; t = Path(blacklight.__file__).parent / 'templates'; assert (t / 'report.md.j2').exists() and (t / 'report.html.j2').exists(); print('templates ok')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
